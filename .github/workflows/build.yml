# Build the add-on feed for every release branch × package architecture and
# publish the binary package repositories to GitHub Pages (gh-pages branch).
#
# One workflow, two channels:
#   push to main          -> builds and publishes main/<release>/<arch>/ (development)
#   push to stable        -> builds only: stable is prepared over several pushes
#                            (cherry-picks, scripts/stable-take.sh) and nothing of
#                            it reaches devices yet
#   release tag on stable -> builds and publishes stable/<release>/<arch>/
#     (YYYY.MM.DD[.N],
#     release-stable.sh)
# A workflow_dispatch on any other branch builds but publishes nothing.
#
# This is the add-on half of the split (2026-10-04): the modem stack lives in
# ddimension/openwrt-repo, everything else here. There is no dependency between
# the two feeds, and a device adds both — ddimension-feed (in the other repo)
# writes one .list per feed. No pre-channel mirror <release>/<arch>/ here: no
# device was ever set up against this repo before the channels existed.
#
# Efficiency: a new push cancels the still-running build of the same ref
# (main, stable and every tag are separate groups), .md-only branch pushes don't
# trigger at all (path filters do not apply to tag pushes), and gh-pages is a
# single orphan commit so the branch never grows (.github/ci/publish-pages.sh,
# the only writer of that branch).
name: build

on:
  push:
    branches: [main, stable]
    tags: ['20[0-9][0-9].[0-9][0-9].[0-9][0-9]*']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # The channel of this run: where its packages are published. A release tag and
  # the stable branch build as stable, anything else as main; only main pushes
  # and release tags publish (see the publish job).
  FEED_CHANNEL: ${{ (github.ref_type == 'tag' || github.ref_name == 'stable') && 'stable' || 'main' }}

jobs:
  build:
    runs-on: [self-hosted, openwrt]
    # 420 min, inherited from the feed this repo was split out of — and this is
    # the expensive half: snapcast-mptcp drags boost, both wpad variants build
    # hostapd, apman pulls collectd (gnutls, libmicrohttpd), nsca-ng openssl.
    # The SDK tree is thrown away per run, so every leg builds that from
    # scratch. Five to seven hours is head-room, not a target.
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        # OpenWrt release branches to build. Add future OpenWrt releases here as
        # they appear (the value doubles as the directory name on the site;
        # 'snapshot' builds against master). A release dropped from this list
        # keeps its published trees until they are removed explicitly
        # (publish-pages.sh --remove).
        release:
          - snapshot
          - openwrt-25.12
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          # rockchip/armv8 (RK33xx/RK35xx) sets ARCH:=aarch64 and no CPU_TYPE,
          # so the whole subtarget lands on the generic aarch64 package arch.
          - aarch64_generic
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a7_neon-vfpv4
          - mips_24kc
          - mipsel_24kc
          - x86_64
    steps:
      # Self-hosted runners share the checkout directory between all jobs of a
      # repository. The reset keeps a leftover workspace state out of a build
      # (the repo is small, a full clone is ~free).
      - name: Reset workspace
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*
      - uses: actions/checkout@v4

      # Per-package mode: the SDK action builds exactly these source packages
      # plus their real dependencies — no whole-feed surface, no exposure to
      # unrelated upstream breakage. The per-package check enforces
      # PKG_MIRROR_HASH: after every PKG_SOURCE_VERSION bump run
      # scripts/update-hashes.sh and commit the Makefile change. The list lives
      # in .github/ci/packages, which scripts/local-build.sh reads too. An empty
      # PACKAGES would make the action build the WHOLE feed (entrypoint.sh) —
      # heatingrod's rust toolchain included — so empty is an error, never a
      # default.
      - name: Package list
        run: |
          pkgs="$(sed 's/#.*//' .github/ci/packages | xargs)"
          [ -n "$pkgs" ] || { echo "::error file=.github/ci/packages::no packages listed"; exit 1; }
          echo "PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "channel $FEED_CHANNEL, packages: $pkgs"

      # make -j inside the SDK container. nproc reports the node's cores there:
      # the runner CT's cgroup quota is invisible inside the nested container
      # (own cgroup namespace -> cpu.max = max), so the SDK would overshoot by a
      # factor. The quota is only readable HERE, in the runner CT, so read it
      # here and pass it in. It also narrows the hostapd parallel-variant race
      # documented in the action's entrypoint.sh — which matters here, this repo
      # owns both wpad variants.
      - name: Parallelism
        run: |
          jobs="$(nproc)"
          if [ -r /sys/fs/cgroup/cpu.max ]; then                    # cgroup v2
            read -r q p < /sys/fs/cgroup/cpu.max
            if [ "$q" != max ] && [ "${p:-0}" -gt 0 ] 2>/dev/null; then
              jobs=$(( (q + p - 1) / p ))
            fi
          elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then     # cgroup v1
            q="$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)"
            p="$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)"
            if [ "${q:-0}" -gt 0 ] 2>/dev/null && [ "${p:-0}" -gt 0 ] 2>/dev/null; then
              jobs=$(( (q + p - 1) / p ))
            fi
          fi
          [ "${jobs:-0}" -ge 1 ] 2>/dev/null || jobs=1
          echo "NPROC=$jobs" >> "$GITHUB_ENV"
          echo "make -j$jobs (cores released to this runner CT)"

      - name: Build packages
        uses: ./.github/actions/openwrt-sdk
        env:
          ARCH: ${{ matrix.arch }}${{ matrix.release != 'snapshot' && format('-{0}', matrix.release) || '' }}
          # The SDK image comes from ghcr.io (action default; CONTAINER would be
          # the UNTAGGED image — the action appends :$ARCH itself), and nothing
          # else is pulled — no docker.io, no buildkit, no binfmt.
          #
          # The feed NAME must differ from the modem feed's ('wwand'): a build
          # tree that carries both — an image build, a local test — would
          # otherwise have two src-git entries called the same, and which clone
          # wins would be up to scripts/feeds.
          FEEDNAME: ddaddon
          # lifts GitHub's anonymous clone limit for the feed updates; see the
          # note in the action's entrypoint. Read-only, and the default token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Wired (and verified after `feeds install`) for whatever needs it;
          # deliberately empty.
          EXTRA_CONFIG: ''
          # PACKAGES comes from the "Package list" step (GITHUB_ENV) — do not
          # set it here, a step env would override it.
          INDEX: 1
          # not staged for openwrt.org upstream — skip patch-refresh and
          # shfmt hygiene checks; the hash check stays active
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          # usign key for opkg-based releases (<= 24.10), apk key for
          # snapshot/25.12+. The SAME keys as ddimension/openwrt-repo, so a
          # device trusts both feeds with the one key it already has. Empty
          # secrets simply leave the index unsigned.
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      # On a red leg the job log only says "failed to build (build variant: …)";
      # the actual compiler/make error lives in the SDK's per-package logs
      # (BUILD_LOG=1 -> logs/package/<feed>/<pkg>/[<variant>/]compile.txt), which
      # entrypoint.sh copies into the workspace at the end.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.release }}-${{ matrix.arch }}
          path: logs
          retention-days: 30
          if-no-files-found: ignore

      - name: Collect repository
        run: |
          dest="public/${{ matrix.release }}/${{ matrix.arch }}"
          mkdir -p "$dest"
          cp -a "bin/packages/${{ matrix.arch }}/ddaddon/." "$dest/"

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.release }}-${{ matrix.arch }}
          path: public
          retention-days: 30

  publish:
    # Publish whatever succeeded even if some matrix legs failed: a leg without
    # an artifact leaves its published tree as it is. !cancelled() keeps that —
    # without a status function GitHub adds success() and one red leg would
    # block the whole publish. Only main pushes and release tags publish; a push
    # to the stable branch only builds.
    needs: build
    if: ${{ !cancelled() && ((github.ref_type == 'branch' && github.ref_name == 'main') || github.ref_type == 'tag') }}
    runs-on: [self-hosted, openwrt]
    permissions:
      contents: write
    steps:
      # Full tree: keys/ and .github/ci/ are needed here.
      - name: Reset workspace
        shell: bash
        run: |
          shopt -s dotglob nullglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*
      # No stored credentials: publish-pages.sh brings its own, and a second
      # Authorization header makes GitHub answer 400 "Duplicate header".
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          path: fresh
          merge-multiple: true

      # Replaces exactly <channel>/<release>/<arch> for every leg that built and
      # nothing else — the other channel stays as it is. Concurrent publishes
      # are handled in publish-pages.sh, the newest-commit rule in
      # publish-feed.sh.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The same script publishes a finished run by hand when only its
        # publish failed (.github/ci/publish-feed.sh <run-id>) — no rebuild.
        # It also refuses when the branch has moved on since this run.
        run: |
          tag=()
          [ "$GITHUB_REF_TYPE" != tag ] || tag=(--tag "$GITHUB_REF_NAME")
          .github/ci/publish-feed.sh --dir fresh \
            --channel "$FEED_CHANNEL" --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" "${tag[@]}"
